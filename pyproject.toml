[project]
name = "multi-agent-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vivek-raj03", email = "vivekraj03023@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.165.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langchain-tavily>=0.2.18",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
multi-agent-langchain = "multi_agent_langchain:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
